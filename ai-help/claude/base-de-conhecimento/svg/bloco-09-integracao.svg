<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 447" width="960" height="447" role="img" aria-labelledby="title desc">
<title id="title">Bloco 9 · Chamadas e eventos têm contratos diferentes</title>
<desc id="desc">APIs recebem chamadas e callouts chamam o ERP. Pub/Sub permite publicação externa de Platform Events e assinatura de eventos; CDC é produzido pela plataforma, não pelo consumidor externo. Referência técnica: https://developer.salesforce.com/docs/platform/pub-sub-api/guide/expanded-event-bus.html. Esquema didático, não desenho físico da infraestrutura.</desc>
