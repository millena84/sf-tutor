"/><path d="M595 127 H700" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M480 170 V235" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><path d="M595 272 H700" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)" marker-start="url(#arrow)"/><text x="30" y="247" text-anchor="start" font-size="14" fill="#1C1440">Entrada ≠ saída</text><text x="30" y="273" text-anchor="start" font-size="14" fill="#1C1440">Chamada ≠ evento</text><text x="30" y="299" text-anchor="start" font-size="14" fill="#1C1440">Timeout ≠ não gravou</text><text x="30" y="330" text-anchor="start" font-size="13" fill="#1C1440">Pub/Sub: publica Platform Events e assina eventos; CDC é gerado pela plataforma.</text><text x="30" y="360" text-anchor="start" font-size="14" fill="#1C1440">Named / External Credentials: endpoint e autenticação sem segredo hardcoded.</text></g><g data-brand-footer="true" aria-label="Desbugando - tecnologia sem mistério"><rect x="0" y="395" width="960" height="52" fill="#1C1440"/><g opacity="0.92"><svg x="18" y="403" width="36" height="36" viewBox="0 0 120 120" aria-hidden="true">
