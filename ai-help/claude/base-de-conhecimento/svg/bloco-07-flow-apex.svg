<rect width="960" height="375" fill="#F5F7FF"/>
<g font-family="Arial, DejaVu Sans, sans-serif"><text x="28" y="35" text-anchor="start" font-size="20" fill="#0B0F2A">Bloco 7 · Escolher pelo problema, não pelo slogan</text><rect x="65" y="100" width="245" height="110" rx="5" fill="#9B6BFF" fill-opacity="0.12" stroke="#9B6BFF" stroke-width="1"/><text x="187.5" y="147.0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">Flow</text><text x="187.5" y="170.0" text-anchor="middle" font-size="13" fill="#1C1440">orquestração simples</text><rect x="355" y="100" width="250" height="110" rx="5" fill="#3EE6F2" fill-opacity="0.16" stroke="#3EE6F2" stroke-width="1"/><text x="480.0" y="147.0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">Flow + Apex</text><text x="480.0" y="170.0" text-anchor="middle" font-size="13" fill="#1C1440">orquestração + serviço</text><rect x="650" y="100" width="245" height="110" rx="5" fill="#9B6BFF" fill-opacity="0.12" stroke="#9B6BFF" stroke-width="1"/><text x="772.5" y="147.0" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">Apex</text><text x="772.5" y="170.0" text-anchor="middle" font-size="13" fill="#1C1440">controle e algoritmos</text><path d="M100 260 H860" fill="none" stroke="#3EE6F2" stroke-width="1.6" marker-end="url(#arrow)"/><text x="480" y="290" text-anchor="middle" font-size="16" fill="#3EE6F2" fill-opacity="0.16">Complexidade · volume · dependências · governança</text><text x="480" y="315" text-anchor="middle" font-size="13" fill="#1C1440">Não é uma escala automática nem uma hierarquia de qualidade.</text><text x="480" y="342" text-anchor="middle" font-size="13" fill="#1C1440">Automação antiga sem suporte ainda pode executar: investigue.</text></g><g data-brand-footer="true" aria-label="Desbugando - tecnologia sem mistério"><rect x="0" y="375" width="960" height="52" fill="#1C1440"/><g opacity="0.92"><svg x="18" y="383" width="36" height="36" viewBox="0 0 120 120" aria-hidden="true">
