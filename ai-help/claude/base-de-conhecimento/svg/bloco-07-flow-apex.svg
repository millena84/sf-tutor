<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 427" width="960" height="427" role="img" aria-labelledby="title desc">
<title id="title">Bloco 7 · Escolher pelo problema, não pelo slogan</title>
<desc id="desc">Flow, combinação e Apex são opções avaliadas por volume, complexidade, controle e manutenção. Sem suporte não significa automação desligada. Referência técnica: https://architect.salesforce.com/docs/architect/decision-guides/guide/record-triggered. Esquema didático, não desenho físico da infraestrutura.</desc>
