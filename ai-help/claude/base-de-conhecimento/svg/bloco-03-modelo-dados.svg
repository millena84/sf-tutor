<title id="title">Bloco 3 · Modelo lógico do pedido</title>
<desc id="desc">Account é o cliente, Pedido o referencia por lookup, e ItemPedido depende do Pedido por master-detail. Referência técnica: https://developer.salesforce.com/docs/platform/salesforce-soql-sosl/guide/sforce-api-calls-soql-relationships.html. Esquema didático, não desenho físico da infraestrutura.</desc>
