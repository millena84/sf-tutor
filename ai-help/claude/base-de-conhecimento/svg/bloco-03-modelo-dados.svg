 esquema físico interno.</text></g><g data-brand-footer="true" aria-label="Desbugando - tecnologia sem mistério"><rect x="0" y="330" width="960" height="52" fill="#1C1440"/><g opacity="0.92"><svg x="18" y="338" width="36" height="36" viewBox="0 0 120 120" aria-hidden="true">
