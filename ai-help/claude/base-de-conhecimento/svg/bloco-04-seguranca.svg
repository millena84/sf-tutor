<title id="title">Bloco 4 · Acesso exige combinar camadas</title>
<desc id="desc">Após autenticar, capacidade no objeto e campo e acesso aos registros convergem para a operação autorizada. Referência técnica: https://developer.salesforce.com/docs/platform/lwc/guide/apex-security. Esquema didático, não desenho físico da infraestrutura.</desc>
