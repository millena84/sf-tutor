<rect width="960" height="365" fill="#F5F7FF"/>
<g font-family="Arial, DejaVu Sans, sans-serif"><text x="28" y="35" text-anchor="start" font-size="20" fill="#0B0F2A">Bloco 8 · Dois caminhos para acessar dados</text><rect x="40" y="140" width="190" height="85" rx="5" fill="#9B6BFF" fill-opacity="0.12" stroke="#9B6BFF" stroke-width="1"/><text x="135.0" y="174.5" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">LWC</text><text x="135.0" y="197.5" text-anchor="middle" font-size="13" fill="#1C1440">JS + estado</text><rect x="345" y="75" width="240" height="85" rx="5" fill="#3EE6F2" fill-opacity="0.16" stroke="#3EE6F2" stroke-width="1"/><text x="465.0" y="109.5" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">LDS / UI API</text><text x="465.0" y="132.5" text-anchor="middle" font-size="13" fill="#1C1440">caminho padronizado</text><rect x="345" y="215" width="240" height="85" rx="5" fill="#9B6BFF" fill-opacity="0.12" stroke="#9B6BFF" stroke-width="1"/><text x="465.0" y="249.5" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">Apex</text><text x="465.0" y="272.5" text-anchor="middle" font-size="13" fill="#1C1440">método customizado</text><rect x="705" y="140" width="220" height="85" rx="5" fill="#3EE6F2" fill-opacity="0.16" stroke="#3EE6F2" stroke-width="1"/><text x="815.0" y="174.5" text-anchor="middle" dominant-baseline="central" font-size="16" fill="#0B0F2A">Dados da org</text><text x="815.0" y="197.5" text-anchor="middle" font-size="13" fill="#1C1440">acesso protegido</text><path d="M230 168 H285 V117 H345" fill="none" stroke="#3EE6F2" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M230 197 H285 V257 H345" fill="none" stroke="#3EE6F2" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M585 117 H645 V167 H705" fill="none" stroke="#3EE6F2" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M585 257 H645 V197 H705" fill="none" stroke="#3EE6F2" stroke-width="1.6" marker-end="url(#arrow)"/><text x="40" y="330" text-anchor="start" font-size="14" fill="#1C1440">@wire também pode chamar Apex cacheável; não significa sempre LDS.</text></g><g data-brand-footer="true" aria-label="Desbugando - tecnologia sem mistério"><rect x="0" y="365" width="960" height="52" fill="#1C1440"/><g opacity="0.92"><svg x="18" y="373" width="36" height="36" viewBox="0 0 120 120" aria-hidden="true">
