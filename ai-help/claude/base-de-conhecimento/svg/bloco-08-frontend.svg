<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 417" width="960" height="417" role="img" aria-labelledby="title desc">
<title id="title">Bloco 8 · Dois caminhos para acessar dados</title>
<desc id="desc">Um componente LWC pode acessar dados por LDS e UI API ou por métodos Apex, com responsabilidades diferentes. Referência técnica: https://developer.salesforce.com/docs/platform/lwc/guide/apex-security. Esquema didático, não desenho físico da infraestrutura.</desc>
