<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 397" width="960" height="397" role="img" aria-labelledby="title desc">
<title id="title">Bloco 6 · Salvar ainda não é confirmar</title>
<desc id="desc">Antes do commit, automações compartilham a transação. Trabalho assíncrono posterior tem outra fronteira. Referência técnica: https://developer.salesforce.com/docs/platform/apex-dev/references/apex-dev/apex-triggers-order-of-execution.html. Esquema didático, não desenho físico da infraestrutura.</desc>
