 y="180.0" text-anchor="middle" font-size="13" fill="#1C1440">outra transação</text><path d="M190 165 H220" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M375 165 H405" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M560 165 H615" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M735 165 H790" fill="none" stroke="#1C1440" stroke-width="1.6" marker-end="url(#arrow)"/><text x="40" y="282" text-anchor="start" font-size="14" fill="#1C1440">Recorte da ordem oficial: há gravação ainda sem commit e outras etapas intermediárias.</text><text x="40" y="307" text-anchor="start" font-size="16" fill="#1C1440">After-save ≠ after-commit.</text></g><g data-brand-footer="true" aria-label="Desbugando - tecnologia sem mistério"><rect x="0" y="345" width="960" height="52" fill="#1C1440"/><g opacity="0.92"><svg x="18" y="353" width="36" height="36" viewBox="0 0 120 120" aria-hidden="true">
