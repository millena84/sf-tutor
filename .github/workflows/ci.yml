# Roda a validação dos insumos e a verificação do site em cada PR (issue #16).
# Um PR com validação quebrada fica vermelho; os números de performance vão anexados ao run.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  insumos:
    name: Insumos (validação e testes)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
        working-directory: ai-help/claude/insumos-grafo
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-help/claude/insumos-grafo/requirements.txt

      - name: Instalar dependências
        run: python -m pip install -r requirements.txt

      - name: Regenerar e validar a base (0 erros e 0 avisos)
        run: |
          python ferramentas/sftutor.py tudo | tee "$RUNNER_TEMP/sftutor.log"
          tail -n 1 "$RUNNER_TEMP/sftutor.log" | grep -qx 'validação: 0 erro(s), 0 aviso(s)' \
            || { echo "::error::A validação da base terminou com erros ou avisos."; exit 1; }

      - name: Arquivos gerados estão em dia
        run: |
          if [ -n "$(git status --porcelain -- .)" ]; then
            echo "::error::Rodar 'python3 ferramentas/sftutor.py tudo' muda arquivos versionados. Rode localmente e inclua o resultado no commit."
            git status --short -- .
            exit 1
          fi

      - name: Testes dos insumos
        run: python -m unittest discover -s testes

  site:
    name: Site (build, lint, testes, e2e e perf)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: bash
        working-directory: apps/sf-tutor
    steps:
      - uses: actions/checkout@v7

      # O build do site regenera e valida a base (npm run dados chama o sftutor.py).
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: ai-help/claude/insumos-grafo/requirements.txt

      - name: Instalar dependências dos insumos
        run: python -m pip install -r ../../ai-help/claude/insumos-grafo/requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/sf-tutor/package-lock.json

      - name: Instalar dependências do site
        run: npm ci

      # No CI os testes usam o Chromium do Playwright (o playwright.config.ts ignora o Chrome da máquina quando CI está definido).
      - name: Instalar o Chromium do Playwright
        run: npx playwright install --with-deps chromium

      # Ordem obrigatória: build → lint → Vitest → e2e (desktop e mobile) → perf. Os e2e servem a pasta dist/.
      - name: Verificar o site
        run: npm run verificar

      - name: Anexar resultados (e2e, capturas e performance)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: site-resultados
          path: |
            apps/sf-tutor/tests/resultados/
            apps/sf-tutor/test-results/
          if-no-files-found: ignore
          retention-days: 14
