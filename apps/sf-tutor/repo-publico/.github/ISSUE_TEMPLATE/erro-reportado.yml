# Modelo de issue do repositório público do Metadata Desbugado (millena84/metadata-desbugando).
# Fonte: apps/sf-tutor/repo-publico/ no sf-tutor; o workflow de publicação copia esta pasta para o repositório público.
# Os ids dos campos são os mesmos que o botão "Reportar erro" do site preenche pela URL (src/reporte.ts).
name: Reportar erro de informação
description: Avise sobre uma informação incorreta, desatualizada ou confusa no Metadata Desbugado.
title: "ERRO REPORTADO: Metadata Desbugado"
labels: ["erro-reportado"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o Metadata Desbugado! Este formulário é sobre **o conteúdo do site** (uma ficha, um campo ou uma ligação do mapa). **Não é suporte da Salesforce:** problemas na sua org vão para a Ajuda da Salesforce ou a comunidade Trailblazer.
        **Esta issue é pública: não inclua dados da sua org** (credenciais, IDs de registros, dados de clientes) **nem o seu e-mail.** O GitHub avisa você pelas notificações da issue.
        Se abriu pelo botão "Reportar erro" do site, os campos já vêm preenchidos: confira e envie.
  - type: input
    id: item
    attributes:
      label: Item
      description: Nome e identificador do item no site (e o campo ou a propriedade, se for o caso).
      placeholder: "Security Settings (mdt:SecuritySettings)"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link para o item
      placeholder: "https://millena84.github.io/metadata-desbugando/?..."
  - type: input
    id: versao
    attributes:
      label: Versão dos dados
      description: Aparece no rodapé do site (API, contrato e insumos).
  - type: input
    id: status
    attributes:
      label: Status no site
      description: O selo que o site mostra para o item ou o campo (Verificado, Desconhecido…). Preenchido pelo botão do site.
  - type: input
    id: tipo
    attributes:
      label: O que aconteceu
      description: "Está errado, está desatualizado, ficou confuso, fonte quebrada ou errada, ligação errada no mapa ou outra coisa."
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que você viu
      description: O que está escrito no site e por que parece errado, confuso ou desatualizado.
    validations:
      required: true
  - type: textarea
    id: correto
    attributes:
      label: Como deveria ser
  - type: input
    id: fonte
    attributes:
      label: Como você sabe
      description: Link para a documentação oficial da Salesforce e/ou "pela prática".
  - type: checkboxes
    id: sem-dados
    attributes:
      label: Confirmação
      options:
        - label: Não incluí dados da minha org nem dados pessoais de terceiros.
          required: true
