# Modelo de issue do repositório público do tutorial (millena84/tutorial-sf-grafo).
# Fonte: apps/sf-tutor/repo-publico/ no sf-tutor; o workflow de publicação copia esta pasta para o repositório público.
# Os ids dos campos são os mesmos que o botão "Reportar erro" do site preenche pela URL (src/reporte.ts).
name: Reportar erro de informação
description: Avise sobre uma informação incorreta, desatualizada ou confusa no tutorial.
title: "ERRO REPORTADO: tutorial Salesforce - sf-tutor"
labels: ["erro-reportado"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por ajudar a melhorar o tutorial! **Esta issue é pública: não inclua dados da sua org** (credenciais, tokens, IDs de registros, nomes de clientes ou dados pessoais de terceiros).
        Se abriu pelo botão "Reportar erro" do site, os campos já vêm preenchidos: confira e envie.
  - type: input
    id: item
    attributes:
      label: Item
      description: Nome e identificador do item no tutorial (e o campo ou a propriedade, se for o caso).
      placeholder: "Security Settings (mdt:SecuritySettings)"
    validations:
      required: true
  - type: input
    id: link
    attributes:
      label: Link para o item
      placeholder: "https://millena84.github.io/tutorial-sf-grafo/?..."
  - type: input
    id: versao
    attributes:
      label: Versão dos dados
      description: Aparece no rodapé do site (API, contrato e insumos).
  - type: input
    id: tipo
    attributes:
      label: Tipo de problema
      description: "Informação incorreta, desatualizada, fonte quebrada ou errada, texto confuso, ligação errada no mapa ou outro."
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: O que está errado
      description: O que a ficha afirma e por que parece errado.
    validations:
      required: true
  - type: textarea
    id: correto
    attributes:
      label: Qual seria o correto
  - type: input
    id: fonte
    attributes:
      label: Fonte
      description: Link para a documentação oficial da Salesforce que confirma o correto, se tiver.
  - type: checkboxes
    id: sem-dados
    attributes:
      label: Confirmação
      options:
        - label: Não incluí dados da minha org nem dados pessoais de terceiros.
          required: true
